version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: workspace-hub
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: workspace-hub
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:15-alpine
    container_name: workspace-hub_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: workspace-hub_test
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: workspace-hub_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: workspace-hub_minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

  redis_test:
    image: redis:7-alpine
    container_name: workspace-hub_redis_test
    ports:
      - '6380:6379'
    volumes:
      - redis_test_data:/data
    restart: always

  minio_test:
    image: minio/minio:latest
    container_name: workspace-hub_minio_test
    ports:
      - '9002:9000'
      - '9003:9003'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9003"
    volumes:
      - minio_test_data:/data
    restart: always
volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  redis_test_data:
  minio_data:
  minio_test_data:
